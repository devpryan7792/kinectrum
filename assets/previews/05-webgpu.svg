<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080B" />
      <stop offset="100%" stop-color="#0E1017" />
    </linearGradient>
    <pattern id="grid05" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'JetBrains Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bg05)" rx="8" />
  <rect width="600" height="340" fill="url(#grid05)" rx="8" />
  <rect x="1" y="1" width="598" height="338" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" rx="8" />

  <!-- Badge Top -->
  <rect x="24" y="22" width="180" height="20" rx="3" fill="#1A1B26" stroke="#E0AF68" stroke-width="0.8" stroke-opacity="0.4" />
  <text x="32" y="36" class="mono" font-size="9" font-weight="700" fill="#E0AF68" letter-spacing="1.5">SPECIMEN 05 · WEBGPU</text>
  <text x="576" y="36" class="mono" font-size="9" fill="#565F89" text-anchor="end">WGSL COMPUTE · 100K+ BODIES</text>

  <!-- WGSL Curl Noise Vector Streamlines & Compute Workgroup Grid -->
  <g transform="translate(300, 170)">
    <!-- 3D Simplex Curl Streamlines -->
    <path d="M -160 -60 Q -90 -120 0 -80 T 140 -90" fill="none" stroke="#7AA2F7" stroke-width="1.2" stroke-opacity="0.4" />
    <path d="M -170 -20 Q -80 -60 0 0 T 160 -30" fill="none" stroke="#7DCFFF" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M -160 30 Q -60 60 10 20 T 170 30" fill="none" stroke="#BB9AF7" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M -150 70 Q -70 110 0 70 T 150 90" fill="none" stroke="#E0AF68" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- Vortex Swirl Filament Curves -->
    <path d="M -30 -30 C 40 -80 100 20 20 60 C -40 70 -80 -10 -10 -40 C 30 -60 70 0 30 30" fill="none" stroke="#FF7A93" stroke-width="1" stroke-opacity="0.7" stroke-dasharray="3,2" />

    <!-- Workgroup Compute Tile Indicator (64-thread local workgroup) -->
    <rect x="-85" y="-55" width="170" height="110" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4,4" rx="4" />
    <text x="-75" y="-40" class="mono" font-size="7" fill="#E0AF68">@workgroup_size(64)</text>

    <!-- Dense Particle Nodes (Color Mapped by Velocity) -->
    <!-- High-velocity particles (Hot Gold/White) -->
    <circle cx="10" cy="5" r="2.5" fill="#FFFFFF" />
    <circle cx="18" cy="-8" r="2" fill="#E0AF68" />
    <circle cx="-5" cy="14" r="2" fill="#FF9E3B" />
    <circle cx="35" cy="12" r="1.8" fill="#FF7A93" />
    <circle cx="-25" cy="-15" r="1.8" fill="#E0AF68" />

    <!-- Medium-velocity particles (Purple/Blue) -->
    <circle cx="-70" cy="-35" r="1.5" fill="#BB9AF7" />
    <circle cx="-95" cy="-20" r="1.2" fill="#7AA2F7" />
    <circle cx="-120" cy="-30" r="1" fill="#7AA2F7" opacity="0.6" />
    <circle cx="80" cy="-45" r="1.5" fill="#7DCFFF" />
    <circle cx="110" cy="-35" r="1.2" fill="#7DCFFF" />
    <circle cx="135" cy="-50" r="1" fill="#7AA2F7" opacity="0.6" />

    <circle cx="-80" cy="45" r="1.5" fill="#BB9AF7" />
    <circle cx="-110" cy="35" r="1.2" fill="#BB9AF7" />
    <circle cx="90" cy="55" r="1.5" fill="#E0AF68" />
    <circle cx="120" cy="45" r="1.2" fill="#FF9E3B" />

    <!-- Ping-Pong Storage Buffer Architecture Schema -->
    <g transform="translate(0, 105)">
      <rect x="-110" y="-12" width="100" height="18" rx="2" fill="#13151F" stroke="#7AA2F7" stroke-width="0.8" />
      <text x="-60" y="0" class="mono" font-size="7.5" fill="#7AA2F7" text-anchor="middle">BUFFER A (READ)</text>

      <path d="M 0 -3 L 15 -3" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" />
      <polygon points="17,-3 12,-6 12,0" fill="#FFFFFF" fill-opacity="0.4" />

      <rect x="25" y="-12" width="100" height="18" rx="2" fill="#13151F" stroke="#E0AF68" stroke-width="0.8" />
      <text x="75" y="0" class="mono" font-size="7.5" fill="#E0AF68" text-anchor="middle">BUFFER B (WRITE)</text>
    </g>
  </g>

  <!-- Bottom Legend -->
  <text x="24" y="316" class="sans" font-size="13" font-weight="700" fill="#F6F3EC">MILLION-BODY COMPUTE SWARM</text>
  <text x="576" y="316" class="mono" font-size="9.5" fill="#E0AF68" text-anchor="end">ZERO CPU READBACK PIPELINE</text>
</svg>
